<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="VEXIS logo">
  <defs>
    <linearGradient id="vxStroke" x1="12" y1="10" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9d5ff" />
      <stop offset=".38" stop-color="#c084fc" />
      <stop offset=".72" stop-color="#a855f7" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="vxCore" x1="30" y1="28" x2="66" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f3ff" />
      <stop offset=".5" stop-color="#c084fc" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="vxHalo" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".45" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="vxGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="96" height="96" rx="22" fill="#08050f" />
  <circle cx="48" cy="44" r="40" fill="url(#vxHalo)" />

  <!-- outer tech hex -->
  <path d="M48 6 82 25.5v45L48 90 14 70.5v-45Z" fill="none" stroke="url(#vxStroke)" stroke-width="2.2" filter="url(#vxGlow)" />
  <path d="M48 12.5 76.5 28.8v38.4L48 83.5 19.5 67.2V28.8Z" fill="#0b0716" stroke="#a855f7" stroke-opacity=".35" stroke-width="1" />

  <!-- circuit accents -->
  <g stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round">
    <path d="M48 6v9M48 81v9M14 48h9M73 48h9" />
    <path d="M26 32h6M64 64h6M64 32h6M26 64h6" />
  </g>
  <g fill="#22d3ee" fill-opacity=".8">
    <circle cx="48" cy="6" r="1.8" />
    <circle cx="48" cy="90" r="1.8" />
    <circle cx="14" cy="48" r="1.8" />
    <circle cx="82" cy="48" r="1.8" />
  </g>

  <!-- V mark -->
  <path d="M28 32.5 48 74l20-41.5" fill="none" stroke="url(#vxCore)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" filter="url(#vxGlow)" />
  <path d="M28 32.5 48 74l20-41.5" fill="none" stroke="#f5f3ff" stroke-width="1.4" stroke-opacity=".85" stroke-linecap="square" />

  <!-- key bit / data node -->
  <path d="M48 58v11M43 64h10M43 69h10" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="48" cy="74" r="3.2" fill="#22d3ee" />
</svg>
