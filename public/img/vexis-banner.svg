<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="VEXIS cyberpunk banner">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1600" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05030a" />
      <stop offset=".45" stop-color="#0a0517" />
      <stop offset=".78" stop-color="#120729" />
      <stop offset="1" stop-color="#07040f" />
    </linearGradient>
    <radialGradient id="bGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".4" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bNeon" x1="900" y1="120" x2="1420" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f3ff" />
      <stop offset=".35" stop-color="#c084fc" />
      <stop offset=".7" stop-color="#a855f7" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="bText" x1="1140" y1="0" x2="1480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f3ff" />
      <stop offset=".55" stop-color="#c084fc" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="bFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04030a" stop-opacity=".97" />
      <stop offset=".42" stop-color="#04030a" stop-opacity=".72" />
      <stop offset=".72" stop-color="#04030a" stop-opacity=".18" />
      <stop offset="1" stop-color="#04030a" stop-opacity="0" />
    </linearGradient>
    <filter id="bBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="bSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.6" result="bl" />
      <feMerge>
        <feMergeNode in="bl" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="bScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#ffffff" opacity=".045" />
    </pattern>
  </defs>

  <rect width="1600" height="700" fill="url(#bBg)" />
  <ellipse cx="1180" cy="330" rx="520" ry="380" fill="url(#bGlowA)" />
  <ellipse cx="1460" cy="170" rx="260" ry="220" fill="url(#bGlowB)" opacity=".65" />

  <!-- skyline -->
  <g fill="#0a0617" stroke="#a855f7" stroke-opacity=".28" stroke-width="1.5">
    <path d="M0 560h70v-120h48v120h54V470h62v90h40V520h70v140H0Z" />
    <path d="M1330 560h52V430h58v130h46V500h60v60h54v120h-270Z" />
  </g>
  <g fill="#c084fc" opacity=".5">
    <rect x="82" y="452" width="6" height="14" /><rect x="100" y="452" width="6" height="14" />
    <rect x="140" y="490" width="6" height="14" /><rect x="158" y="490" width="6" height="14" />
    <rect x="1350" y="452" width="6" height="14" /><rect x="1368" y="452" width="6" height="14" />
    <rect x="1450" y="520" width="6" height="14" /><rect x="1470" y="520" width="6" height="14" />
  </g>

  <!-- perspective grid floor -->
  <g stroke="#a855f7" stroke-opacity=".2" stroke-width="1.4">
    <path d="M1180 360 580 700M1180 360 760 700M1180 360 940 700M1180 360 1120 700M1180 360 1240 700M1180 360 1420 700M1180 360 1600 700" />
    <path d="M-60 700h1720M0 640h1600M0 596h1600M40 562h1520" />
  </g>
  <g stroke="#22d3ee" stroke-opacity=".28" stroke-width="1.6">
    <path d="M1180 360 520 560M1180 360 1600 470" fill="none" />
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="#a855f7" stroke-opacity=".4" filter="url(#bSoft)">
    <ellipse cx="1170" cy="330" rx="300" ry="112" transform="rotate(-18 1170 330)" />
    <ellipse cx="1170" cy="330" rx="360" ry="140" transform="rotate(14 1170 330)" stroke-opacity=".18" />
  </g>

  <!-- main hex emblem -->
  <g transform="translate(1170 330) scale(3.05)">
    <path d="M0 -96 83 -48v96L0 96-83 48v-96Z" fill="#0b0718" stroke="url(#bNeon)" stroke-width="2.4" filter="url(#bSoft)" />
    <path d="M0 -88 75 -44.5v89L0 88-75 44.5v-89Z" fill="none" stroke="#a855f7" stroke-opacity=".35" stroke-width="1" />
    <g stroke="#22d3ee" stroke-opacity=".5" stroke-width="1" stroke-linecap="round">
      <path d="M0 -96v12M0 84v12M-83 0h12M71 0h12" />
    </g>
    <path d="M-40 -44 0 44l40-88" fill="none" stroke="url(#bNeon)" stroke-width="12" stroke-linecap="square" filter="url(#bSoft)" />
    <path d="M-40 -44 0 44l40-88" fill="none" stroke="#f5f3ff" stroke-width="2" stroke-linecap="square" stroke-opacity=".9" />
    <path d="M0 8v22M-9 18h18M-9 27h18" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="44" r="6" fill="#22d3ee" />
  </g>

  <!-- floating shards -->
  <g stroke="#22d3ee" stroke-opacity=".55" fill="#22d3ee" fill-opacity=".08">
    <path d="M900 170l34 18-34 18-34-18Z" />
    <path d="M1450 470l26 14-26 14-26-14Z" />
    <path d="M820 560l20 11-20 11-20-11Z" />
  </g>
  <g stroke="#c084fc" stroke-opacity=".55" fill="#c084fc" fill-opacity=".1">
    <path d="M1320 110l42 22-42 22-42-22Z" />
    <path d="M980 610l30 16-30 16-30-16Z" />
  </g>
  <g fill="#c084fc" opacity=".8">
    <circle cx="1390" cy="250" r="3" /><circle cx="880" cy="300" r="2.4" />
    <circle cx="1510" cy="380" r="2.4" /><circle cx="760" cy="190" r="2" />
  </g>

  <!-- brand wordmark -->
  <g opacity=".95">
    <text x="1520" y="104" text-anchor="end" font-family="Orbitron, 'Arial Black', sans-serif" font-size="46" font-weight="900" letter-spacing="14" fill="url(#bText)">VEXIS</text>
    <text x="1520" y="138" text-anchor="end" font-family="Kanit, Arial, sans-serif" font-size="16" letter-spacing="7" fill="#c084fc" opacity=".85">FREE FIRE KEY STORE</text>
  </g>

  <!-- readable text zone -->
  <rect width="1600" height="700" fill="url(#bFade)" />
  <rect width="1600" height="700" fill="url(#bScan)" />
</svg>
