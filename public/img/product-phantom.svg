<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="PHANTOM KEY">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset=".55" stop-color="#0b0918"/>
      <stop offset="1" stop-color="#070810"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#b06bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d7ff"/>
      <stop offset=".45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <ellipse cx="400" cy="215" rx="330" ry="200" fill="url(#glow)"/>
  <g transform="rotate(-28 400 225)">
    <circle cx="300" cy="225" r="72" fill="none" stroke="url(#key)" stroke-width="22"/>
    <circle cx="300" cy="225" r="34" fill="#0b0918" stroke="#c084fc" stroke-width="8"/>
    <rect x="360" y="206" width="240" height="38" rx="10" fill="url(#key)"/>
    <rect x="500" y="244" width="26" height="52" rx="7" fill="url(#key)"/>
    <rect x="556" y="244" width="26" height="34" rx="7" fill="url(#key)"/>
  </g>
  <g fill="#e9d5ff" font-family="Kanit, system-ui, sans-serif">
    <text x="44" y="70" font-size="20" letter-spacing="6" fill="#c084fc" opacity=".9">VEXIS · PREMIUM KEY</text>
    <text x="44" y="132" font-size="54" font-weight="700" letter-spacing="2">PHANTOM</text>
    <text x="46" y="164" font-size="18" letter-spacing="8" fill="#a78bfa" opacity=".85">UNDETECTED · 30 DAYS</text>
  </g>
  <g stroke="#c084fc" stroke-opacity=".5" fill="none">
